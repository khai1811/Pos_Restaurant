services:
  restaurant_db:
    image: postgres:15-alpine
    container_name: restaurant_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: pos_restaurant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  restaurant_api:
    build: .
    container_name: restaurant_api
    restart: always
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:mysecretpassword@restaurant_db:5432/pos_restaurant?schema=public"
      JWT_SECRET: "your_super_secret_jwt_key_here"
    depends_on:
      - restaurant_db

volumes:
  postgres_data:
